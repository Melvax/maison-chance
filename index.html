<style>
  :root {
    --bg: #050505;
    --fg: #f4f1ec;
    --muted: #8a8782;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    cursor: crosshair;
  }

  #scene { position: fixed; inset: 0; }
  #stage { display: block; width: 100%; height: 100%; }

  /* ---- UI overlay ---- */
  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .ui > * { position: absolute; }

  .title {
    top: 4.5vh;
    left: 4vw;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: clamp(48px, 9vw, 150px);
    line-height: 0.9;
    letter-spacing: 0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #d8d3ca 55%, #8f8b84 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    top: 5vh;
    right: 4vw;
    text-align: right;
    font-size: clamp(9px, 0.85vw, 12px);
    letter-spacing: 0.18em;
    line-height: 1.7;
    text-transform: uppercase;
    color: var(--fg);
  }

  .date {
    top: 50%;
    left: 2.6vw;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.32em;
    color: var(--muted);
  }

  .footer {
    bottom: 6vh;
    left: 4vw;
    font-size: clamp(9px, 0.85vw, 12px);
    letter-spacing: 0.2em;
    line-height: 1.9;
    text-transform: uppercase;
    color: var(--fg);
  }

  .hint {
    bottom: 6vh;
    right: 4vw;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }
</style>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });
  const img = document.getElementById("src");

  // Tunables that define the "membrane" feel
  const GAP = 5;              // sample every Nth pixel -> LED grid density
  const DOT = 2.0;           // base dot radius
  const RADIUS = 70;         // interaction crater radius (px)
  const EASING = 0.15;       // high-friction lerp (snap back, no bounce)
  const ALPHA_CUT = 26;      // skip near-black background pixels

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  let particles = [];

  const mouse = { x: -9999, y: -9999, active: false, radius: RADIUS };

  // Offscreen canvas to read the source image's pixels
  const buf = document.createElement("canvas");
  const bctx = buf.getContext("2d", { willReadFrequently: true });

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build() {
    if (!img.complete || !img.naturalWidth) return;

    // Fit the flower into a centred box, scaled to the viewport
    const target = Math.min(W, H) * 0.62;
    const scale = target / Math.max(img.naturalWidth, img.naturalHeight);
    const dw = Math.round(img.naturalWidth * scale);
    const dh = Math.round(img.naturalHeight * scale);

    buf.width = dw;
    buf.height = dh;
    bctx.clearRect(0, 0, dw, dh);
    bctx.drawImage(img, 0, 0, dw, dh);

    const offsetX = (W - dw) / 2;
    const offsetY = (H - dh) / 2 - H * 0.02; // nudge up a touch
    const data = bctx.getImageData(0, 0, dw, dh).data;

    particles = [];
    for (let y = 0; y < dh; y += GAP) {
      for (let x = 0; x < dw; x += GAP) {
        const i = (y * dw + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const lum = (r + g + b) / 3;
        if (lum < ALPHA_CUT) continue; // leave the black background empty
        particles.push(new Particle(offsetX + x, offsetY + y, r, g, b, lum));
      }
    }
  }

  class Particle {
    constructor(x, y, r, g, b, lum) {
      this.baseX = x;
      this.baseY = y;
      this.x = x;
      this.y = y;
      this.r = r; this.g = g; this.b = b;
      // brighter samples glow a hair larger -> richer compression ring
      const k = Math.min(lum / 255, 1);
      this.size = DOT * (0.7 + k * 0.7);
      this.core = "rgb(" + r + "," + g + "," + b + ")";
      // translucent outer halo -> additive bloom under 'lighter' compositing
      this.halo = "rgba(" + r + "," + g + "," + b + "," + (0.10 + k * 0.22).toFixed(3) + ")";
    }

    update() {
      let dx = this.x - mouse.x;
      let dy = this.y - mouse.y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      let tx = this.baseX;
      let ty = this.baseY;

      if (mouse.active && dist < mouse.radius) {
        // push to the exact perimeter -> dense, glowing compression ring
        const angle = Math.atan2(dy, dx);
        tx = mouse.x + Math.cos(angle) * mouse.radius;
        ty = mouse.y + Math.sin(angle) * mouse.radius;
      }

      // high-friction linear interpolation toward target
      this.x += (tx - this.x) * EASING;
      this.y += (ty - this.y) * EASING;
    }

    draw() {
      // outer halo (soft bloom)
      ctx.fillStyle = this.halo;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 2.4, 0, Math.PI * 2);
      ctx.fill();
      // solid core (the LED)
      ctx.fillStyle = this.core;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame() {
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, W, H);

    // additive blending -> overlapping dots bloom into neon
    ctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.update();
      p.draw();
    }

    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }

  // ---- input ----
  function move(e) {
    const t = e.touches ? e.touches[0] : e;
    mouse.x = t.clientX;
    mouse.y = t.clientY;
    mouse.active = true;
  }
  window.addEventListener("mousemove", move);
  window.addEventListener("touchmove", move, { passive: true });
  window.addEventListener("mouseleave", () => { mouse.active = false; });
  window.addEventListener("touchend", () => { mouse.active = false; });

  window.addEventListener("resize", layout);

  function start() { layout(); frame(); }
  if (img.complete && img.naturalWidth) start();
  else img.onload = start;
})();
</script>
</body>
</html>
