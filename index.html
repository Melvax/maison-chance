<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LOTUS — Immerse Yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #050505;
    --fg: #f4f1ec;
    --muted: #8a8782;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, sans-serif;
    /* lock the viewport on mobile: no scroll, no rubber-band toolbar shifts */
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    cursor: crosshair;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  #scene { position: fixed; inset: 0; }
  #stage { display: block; width: 100%; height: 100%; }

  /* ---- UI overlay ---- */
  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .ui > * { position: absolute; }

  .title {
    top: 4.5vh;
    left: 4vw;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: clamp(48px, 9vw, 150px);
    line-height: 0.9;
    letter-spacing: 0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #d8d3ca 55%, #8f8b84 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    top: 5vh;
    right: 4vw;
    text-align: right;
    font-size: clamp(9px, 0.85vw, 12px);
    letter-spacing: 0.18em;
    line-height: 1.7;
    text-transform: uppercase;
    color: var(--fg);
  }

  .date {
    top: 50%;
    left: 2.6vw;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.32em;
    color: var(--muted);
  }

  .footer {
    bottom: 6vh;
    left: 4vw;
    font-size: clamp(9px, 0.85vw, 12px);
    letter-spacing: 0.2em;
    line-height: 1.9;
    text-transform: uppercase;
    color: var(--fg);
  }

  .hint {
    bottom: 6vh;
    right: 4vw;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }

  /* ---- live control panel ---- */
  #panel {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 5;
    width: 232px;
    max-width: calc(100vw - 28px);
    font-family: "Inter", system-ui, sans-serif;
    color: #e8e5e0;
    touch-action: auto;
  }
  #panel input, #panel button { touch-action: auto; }
  #panelToggle {
    display: block;
    width: 100%;
    cursor: pointer;
    background: rgba(20,20,23,0.85);
    color: #e8e5e0;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 7px 10px;
    font: 500 10px/1 "Inter", sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: left;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  #panelBody {
    margin-top: 8px;
    padding: 13px 13px 11px;
    background: rgba(16,16,19,0.82);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    max-height: 78vh;
    overflow-y: auto;
  }
  #panel.collapsed #panelBody { display: none; }
  .prow { margin-bottom: 11px; }
  .prow label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #9b9893; margin-bottom: 5px;
  }
  .prow label .val { color: #fff; font-size: 10px; font-variant-numeric: tabular-nums; }
  .prow input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,0.18); outline: none; cursor: pointer;
  }
  .prow input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #f4f1ec; border: none; cursor: pointer;
  }
  .prow input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%;
    background: #f4f1ec; cursor: pointer;
  }
  .pbtns { display: flex; gap: 8px; margin-top: 2px; }
  .pbtns button {
    flex: 1; cursor: pointer;
    background: rgba(255,255,255,0.07); color: #e8e5e0;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
    padding: 7px 8px; font: 500 9px/1 "Inter", sans-serif;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .pbtns button:hover, #panelToggle:hover { background: rgba(255,255,255,0.14); }

  /* ---- phones / portrait ---- */
  @media (max-width: 680px), (orientation: portrait) and (max-width: 900px) {
    body { cursor: default; }

    .ui {
      padding:
        calc(env(safe-area-inset-top) + 5vh) 6vw
        calc(env(safe-area-inset-bottom) + 4.5vh) 6vw;
    }

    .title {
      top: auto; left: auto;
      position: static;
      font-size: clamp(46px, 17vw, 96px);
      line-height: 0.95;
    }

    .tagline {
      top: auto; right: auto;
      position: static;
      text-align: left;
      margin-top: 1.4vh;
      font-size: 11px;
      letter-spacing: 0.16em;
      line-height: 1.8;
    }

    /* keep date out of the way on small screens */
    .date { display: none; }

    .footer {
      bottom: auto; left: auto;
      position: absolute;
      left: 6vw;
      bottom: calc(env(safe-area-inset-bottom) + 4.5vh);
      font-size: 11px;
    }

    .hint {
      right: auto; bottom: auto;
      position: absolute;
      right: 6vw;
      bottom: calc(env(safe-area-inset-bottom) + 4.5vh);
      text-align: right;
      font-size: 10px;
    }
  }
</style>
</head>
<body>
  <div id="scene">
    <canvas id="stage"></canvas>
  </div>

  <div class="ui">
    <h1 class="title">LOTUS</h1>
    <div class="tagline">Immerse Yourself<br />In a World of Vibrant<br />Color</div>
    <div class="date">11/02/2025</div>
    <div class="footer">Artisanal Gardens<br />Live Music</div>
    <div class="hint">Hover to disturb</div>
  </div>

  <div id="panel">
    <button id="panelToggle" type="button">Parameters &times;</button>
    <div id="panelBody">
      <div id="panelRows"></div>
      <div class="pbtns">
        <button id="resetBtn" type="button">Reset</button>
        <button id="copyBtn" type="button">Copy</button>
      </div>
    </div>
  </div>

  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });

  // Source is a looping <video>; drawImage() reads its current frame, so the

  const media = document.getElementById("src");
  const mediaReady = () => media.videoWidth > 0 && media.readyState >= 2;
  const mediaW = () => media.videoWidth;
  const mediaH = () => media.videoHeight;

  // Coarse pointer == touch device; render lighter so phones stay at 60fps.
  const COARSE = window.matchMedia("(pointer: coarse)").matches;

    PULLAMT: 0.5,               // fraction of tiles near the cursor that pull
    EASING:  0.16,              // settle speed (lower = longer trailing wake)
    GLITCH:  12,                // optional in-place jitter amplitude (px)
    DENSITY: 0,                 // optional extra jitter (0 = off, clean)

    TEXTURE: 0.6,               // per-tile grain/sheen texture strength (0 = flat)
    GLOW:    0.5,               // blur+glow bloom layer over the grid (0 = off)
    BLUR:    5,                 // bloom blur radius (px)
    DECAY:   260,               // distance over which a pulled tile desaturates
    TWINKLE: 0.18,              // idle shimmer amount
    BREATHE: 0.6,              // idle sway amount (px)
    HUE:     0.5,               // subtle colour shift on pulled tiles (rad)
    SCALE:   1.0,               // flower size multiplier [rebuild]
  };
  const ALPHA_CUT = 26;          // skip near-black background pixels
  const DPR_CAP = COARSE ? 1.5 : 2;
  const TAU = Math.PI * 2;
  // how often we re-read the GIF's current frame into the LED grid (ms).
  // GIFs are low-fps, so this can be coarse; lighter on touch devices.
  const SAMPLE_MS = COARSE ? 120 : 70;

  let dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
  let W = 0, H = 0;
  let particles = [];

  const mouse = { x: -9999, y: -9999, active: false };
  let t = 0; // global animation clock (seconds-ish)

  // deterministic per-dot pseudo-random in [0,1) -> drives the glitch jitter
  function hash(n) {
    const x = Math.sin(n) * 43758.5453;
    return x - Math.floor(x);
  }

  // Luma-preserving hue rotation (radians) -> "rgb()" string. Used to give
  // disturbed dots their animated, random colour shift on hover.
  function rotateHue(r, g, b, a) {
    const c = Math.cos(a), s = Math.sin(a);
    let nr = r * (0.213 + c * 0.787 - s * 0.213) + g * (0.715 - c * 0.715 - s * 0.715) + b * (0.072 - c * 0.072 + s * 0.928);
    let ng = r * (0.213 - c * 0.213 + s * 0.143) + g * (0.715 + c * 0.285 + s * 0.140) + b * (0.072 - c * 0.072 - s * 0.283);
    let nb = r * (0.213 - c * 0.213 - s * 0.787) + g * (0.715 - c * 0.715 + s * 0.715) + b * (0.072 + c * 0.928 + s * 0.072);
    nr = nr < 0 ? 0 : nr > 255 ? 255 : nr | 0;
    ng = ng < 0 ? 0 : ng > 255 ? 255 : ng | 0;
    nb = nb < 0 ? 0 : nb > 255 ? 255 : nb | 0;
    return "rgb(" + nr + "," + ng + "," + nb + ")";
  }

  // ---- per-tile texture sprites (grain + soft top-left sheen, rounded) ----
  const ROUND = 0.26;     // corner radius as a fraction of tile size
  const TEX = [];         // a few variants so tiles don't look identical
  function buildTextures() {
    TEX.length = 0;
    const S = 48;
    for (let v = 0; v < 4; v++) {
      const c = document.createElement("canvas");
      c.width = c.height = S;
      const x = c.getContext("2d");
      // fine grain (light + dark speckle)
      const img = x.createImageData(S, S);
      for (let i = 0; i < S * S; i++) {
        const n = Math.random();
        let val, a;
        if (n > 0.5) { val = 255; a = (n - 0.5) * 2 * 95; }   // light grain
        else { val = 0; a = (0.5 - n) * 2 * 80; }             // dark grain
        img.data[i * 4] = val; img.data[i * 4 + 1] = val;
        img.data[i * 4 + 2] = val; img.data[i * 4 + 3] = a;
      }
      x.putImageData(img, 0, 0);
      // soft sheen toward the top-left (beaded/sequin look)
      x.globalCompositeOperation = "lighter";
      const g = x.createRadialGradient(S * 0.36, S * 0.32, 1, S * 0.5, S * 0.5, S * 0.62);
      g.addColorStop(0, "rgba(255,255,255,0.45)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      x.fillStyle = g;
      x.fillRect(0, 0, S, S);
      // subtle dark inner edge for depth
      x.globalCompositeOperation = "source-over";
      x.strokeStyle = "rgba(0,0,0,0.35)";
      x.lineWidth = 2;
      roundRectPath(x, 1.5, 1.5, S - 3, S - 3, S * ROUND);
      x.stroke();
      // mask everything to the rounded-square shape
      x.globalCompositeOperation = "destination-in";
      x.fillStyle = "#fff";
      roundRectPath(x, 1, 1, S - 2, S - 2, S * ROUND);
      x.fill();
      x.globalCompositeOperation = "source-over";
      TEX.push(c);
    }
  }
  function roundRectPath(c, x, y, w, h, r) {
    if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  buildTextures();

  // Offscreen canvas to read the source image's pixels
  const buf = document.createElement("canvas");
  const bctx = buf.getContext("2d", { willReadFrequently: true });

  // Offscreen canvas for the blur+glow bloom pass
  const glow = document.createElement("canvas");
  const gctx = glow.getContext("2d");

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build() {
    if (!mediaReady()) return;

    // Fit the source into a centred box, scaled to the viewport.
    // On tall/portrait screens, size by width so the subject fills the frame.
    const portrait = H > W;
    const target = (portrait
      ? Math.min(W * 0.92, H * 0.5)
      : Math.min(W, H) * 0.62) * P.SCALE;
    const scale = target / Math.max(mediaW(), mediaH());
    const dw = Math.round(mediaW() * scale);
    const dh = Math.round(mediaH() * scale);

    buf.width = dw;
    buf.height = dh;

    const offsetX = (W - dw) / 2;
    // centre vertically; nudge up on desktop, down a touch on portrait so the
    // subject clears the stacked header
    const offsetY = portrait ? (H - dh) / 2 + H * 0.04 : (H - dh) / 2 - H * 0.02;

    // One particle per grid cell across the whole image. Because the source is
    // an animated GIF, cells light up / go dark over time, so we build the full
    // grid and decide visibility per frame from the freshly sampled colour.
    particles = [];
    for (let y = 0; y < dh; y += P.GAP) {
      for (let x = 0; x < dw; x += P.GAP) {
        particles.push(new Particle(offsetX + x, offsetY + y, x, y));
      }
    }
    sampleColors(); // pull initial colours from the current GIF frame
  }

  // Draw the video's CURRENT frame into the buffer and refresh every particle's
  // colour from its home pixel -> the LED matrix plays the clip.
  function sampleColors() {
    if (!mediaReady() || !buf.width) return;
    bctx.clearRect(0, 0, buf.width, buf.height);
    bctx.drawImage(media, 0, 0, buf.width, buf.height);
    let data;
    try {
      data = bctx.getImageData(0, 0, buf.width, buf.height).data;
    } catch (e) {
      return; // cross-origin GIF without CORS taints the canvas; keep last colours
    }
    const w = buf.width;
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      const idx = (pt.gy * w + pt.gx) * 4;
      pt.setColor(data[idx], data[idx + 1], data[idx + 2]);
    }
  }

  class Particle {
    constructor(x, y, gx, gy) {
      this.baseX = x;
      this.baseY = y;
      this.x = x;
      this.y = y;
      this.gx = gx; this.gy = gy; // home pixel in the sample buffer
      this.r = 0; this.g = 0; this.b = 0; this.lum = 0; this.k = 0;
      this.core = "rgb(0,0,0)";
      this.halA = 0;
      // per-particle phase so the idle shimmer twinkles, not pulses in unison
      this.phase = Math.random() * Math.PI * 2;
      this.tw = 0.6 + Math.random() * 0.8; // individual twinkle speed
      this.disp = 0; // current displacement from home (set each update)
      this.prox = 0; // 0..1 closeness to cursor (set each update)
      this.hueSeed = Math.random(); // random phase for the hover colour shift
      this.gseed = Math.random() * 997 + 3; // seed for the glitch hash
      this.pullRand = Math.random(); // stable -> same tiles pull (no flicker)
      this.texi = (Math.random() * TEX.length) | 0; // texture variant
    }

    // refreshed each sample tick from the GIF's current frame
    setColor(r, g, b) {
      this.r = r; this.g = g; this.b = b;
      const lum = (r + g + b) / 3;
      this.lum = lum;
      this.k = Math.min(lum / 255, 1);
      this.core = "rgb(" + r + "," + g + "," + b + ")";
      this.halA = 0.10 + this.k * 0.22; // halo opacity tracks brightness
    }

    update() {
      const dx = this.baseX - mouse.x;
      const dy = this.baseY - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // gentle idle "breathing" sway so the grid feels alive at rest
      const homeX = this.baseX + Math.sin(t * 0.8 + this.phase) * P.BREATHE;
      const homeY = this.baseY + Math.cos(t * 0.7 + this.phase) * P.BREATHE;

      let tx = homeX, ty = homeY;

      if (mouse.active && dist < P.RADIUS) {
        const force = (P.RADIUS - dist) / P.RADIUS; // 1 at centre -> 0 at edge
        this.prox = force;
        // Only a sparse, STABLE subset of tiles react (so it stays clean, not
        // a glittery mess). They are PULLED toward the cursor, leaving a hole at
        // home and trailing along the cursor's path via the easing lag.
        if (this.pullRand < P.PULLAMT) {
          const amt = P.PULL * force;                 // near cursor pulls hardest
          const px = this.baseX + (mouse.x - this.baseX) * amt;
          const py = this.baseY + (mouse.y - this.baseY) * amt;
          this.x += (px - this.x) * P.EASING;
          this.y += (py - this.y) * P.EASING;
        } else if (P.DENSITY > 0 &&
                   hash(this.gseed + Math.floor(t * P.GSPEED)) < P.DENSITY * force) {
          // optional subtle in-place jitter (off by default)
          const amp = force * P.GLITCH;
          this.x = homeX + (hash(this.gseed * 1.7 + t) - 0.5) * 2 * amp;
          this.y = homeY + (hash(this.gseed * 3.3 + t) - 0.5) * 2 * amp * 0.4;
        } else {
          this.x += (tx - this.x) * P.EASING; // untouched tiles hold the grid
          this.y += (ty - this.y) * P.EASING;
        }
      } else {
        this.prox = 0;
        this.x += (tx - this.x) * P.EASING; // ease back onto the grid
        this.y += (ty - this.y) * P.EASING;
      }

      const ddx = this.x - this.baseX, ddy = this.y - this.baseY;
      this.disp = Math.sqrt(ddx * ddx + ddy * ddy);
    }

    draw() {
      if (this.lum < ALPHA_CUT) return; // dark cell in the current video frame
      // near-uniform tile size -> reads as a solid GRID, not separate dots
      const s = P.DOT * (0.82 + this.k * 0.18);
      const d = s * 2;
      // idle twinkle: modulate additive brightness
      const tw = (1 - P.TWINKLE) + P.TWINKLE * Math.sin(t * this.tw * 2.2 + this.phase);
      // 1 at home -> 0 once flung the full decay distance away
      const lit = Math.max(0, 1 - this.disp / P.DECAY);

      // subtle, stepped colour shift only on tiles that are actually displaced
      // (pulled) -> stationary grid keeps its true colour
      let fill = this.core;
      const infl = 1 - lit;
      if (P.HUE > 0 && infl > 0.02) {
        const ctick = Math.floor(t * P.GSPEED);
        const a = (hash(this.hueSeed * 131 + ctick) - 0.5) * 2 * P.HUE * infl;
        fill = rotateHue(this.r, this.g, this.b, a);
      }

      if (lit > 0.97) {
        // at rest: solid tile (+ a faint square bloom)
        if (P.HALO > 1) {
          const hs = s * P.HALO;
          ctx.fillStyle = fill;
          ctx.globalAlpha = tw * this.halA;
          ctx.fillRect(this.x - hs, this.y - hs, hs * 2, hs * 2);
        }
        this.tile(fill, tw, s, d);
      } else {
        // displaced: tile fades out, decays to a dim desaturated ghost tile
        if (lit > 0.02) this.tile(fill, tw * lit, s, d);
        const lum = this.lum;
        const gr = ((this.r * 0.25 + lum * 0.75) * 0.6) | 0;
        const gg = ((this.g * 0.25 + lum * 0.75) * 0.6) | 0;
        const gb = ((this.b * 0.25 + lum * 0.75) * 0.6) | 0;
        this.tile("rgb(" + gr + "," + gg + "," + gb + ")", (1 - lit) * 0.85, s, d);
      }
      ctx.globalAlpha = 1;
    }

    // a rounded, textured tile (grain + sheen overlay)
    tile(style, alpha, s, d) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = style;
      roundRectPath(ctx, this.x - s, this.y - s, d, d, s * ROUND);
      ctx.fill();
      if (P.TEXTURE > 0) {
        ctx.globalAlpha = alpha * P.TEXTURE;
        ctx.drawImage(TEX[this.texi], this.x - s, this.y - s, d, d);
      }
    }
  }

  let lastSample = 0;
  function frame() {
    t += 1 / 60; // advance the animation clock

    // re-read the video's current frame periodically so the matrix animates
    const now = performance.now();
    if (now - lastSample > SAMPLE_MS) {
      sampleColors();
      lastSample = now;
    }

    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, W, H);

    // normal blending -> clean solid grid; overlapping pulled tiles don't blow out
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.update();
      p.draw();
    }

    // blur + glow bloom layer on top of the grid (additive, from a downscaled,
    // blurred copy of the grid itself)
    if (P.GLOW > 0) {
      const gw = Math.max(1, (W * 0.5) | 0), gh = Math.max(1, (H * 0.5) | 0);
      if (glow.width !== gw || glow.height !== gh) { glow.width = gw; glow.height = gh; }
      gctx.clearRect(0, 0, gw, gh);
      gctx.filter = "blur(" + P.BLUR + "px)";
      gctx.drawImage(canvas, 0, 0, gw, gh);
      gctx.filter = "none";
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = P.GLOW;
      ctx.drawImage(glow, 0, 0, W, H);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  // ---- input ----
  function move(e) {
    const ev = e.touches ? e.touches[0] : e;
    mouse.x = ev.clientX;
    mouse.y = ev.clientY;
    mouse.active = true;
  }
  window.addEventListener("mousemove", move);
  window.addEventListener("touchstart", move, { passive: true });
  window.addEventListener("touchmove", move, { passive: true });
  window.addEventListener("mouseleave", () => { mouse.active = false; });
  window.addEventListener("touchend", () => { mouse.active = false; });
  window.addEventListener("touchcancel", () => { mouse.active = false; });

  // touch-friendly copy
  if (COARSE) {
    const hint = document.querySelector(".hint");
    if (hint) hint.textContent = "Touch & drag to disturb";
  }

  // ---- live control panel ----
  const DEFAULTS = Object.assign({}, P);
  const CONTROLS = [
    { k: "RADIUS",  label: "Radius",          min: 20,   max: 240, step: 1 },
    { k: "PULL",    label: "Pull strength",   min: 0,    max: 1,   step: 0.05 },
    { k: "PULLAMT", label: "Pull amount",     min: 0,    max: 1,   step: 0.05 },
    { k: "EASING",  label: "Trail / settle",  min: 0.05, max: 0.8, step: 0.01 },
    { k: "HUE",     label: "Color shift",     min: 0,    max: 3.14,step: 0.05 },
    { k: "DENSITY", label: "Jitter density",  min: 0,    max: 1,   step: 0.05 },
    { k: "GLITCH",  label: "Jitter amount",   min: 0,    max: 40,  step: 0.5 },
    { k: "GSPEED",  label: "Glitch speed",    min: 2,    max: 40,  step: 1 },
    { k: "DOT",     label: "Tile size",       min: 0.6,  max: 12,  step: 0.1 },
    { k: "TEXTURE", label: "Tile texture",    min: 0,    max: 1,   step: 0.05 },
    { k: "GLOW",    label: "Glow / bloom",    min: 0,    max: 1.5, step: 0.05 },
    { k: "BLUR",    label: "Blur radius",     min: 0,    max: 20,  step: 0.5 },
    { k: "HALO",    label: "Tile bloom",      min: 1,    max: 4,   step: 0.1 },
    { k: "TWINKLE", label: "Twinkle",         min: 0,    max: 0.8, step: 0.01 },
    { k: "BREATHE", label: "Breathe sway",    min: 0,    max: 4,   step: 0.1 },
    { k: "GAP",     label: "Grid gap",        min: 4,    max: 32,  step: 1,    rebuild: true },
    { k: "SCALE",   label: "Flower size",     min: 0.4,  max: 1.6, step: 0.05, rebuild: true },
  ];

  let rebuildTimer = 0;
  function rebuildSoon() {
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(build, 90);
  }

  const rowsEl = document.getElementById("panelRows");
  const inputs = {};
  CONTROLS.forEach((c) => {
    const row = document.createElement("div");
    row.className = "prow";
    const lab = document.createElement("label");
    lab.innerHTML = "<span>" + c.label + "</span><span class='val'></span>";
    const input = document.createElement("input");
    input.type = "range";
    input.min = c.min; input.max = c.max; input.step = c.step;
    input.value = P[c.k];
    const val = lab.querySelector(".val");
    const fmt = (v) => (c.step < 1 ? Number(v).toFixed(2) : String(v));
    val.textContent = fmt(P[c.k]);
    input.addEventListener("input", () => {
      P[c.k] = parseFloat(input.value);
      val.textContent = fmt(P[c.k]);
      if (c.rebuild) rebuildSoon();
    });
    inputs[c.k] = { input, val, fmt };
    row.appendChild(lab);
    row.appendChild(input);
    rowsEl.appendChild(row);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    Object.assign(P, DEFAULTS);
    CONTROLS.forEach((c) => {
      inputs[c.k].input.value = P[c.k];
      inputs[c.k].val.textContent = inputs[c.k].fmt(P[c.k]);
    });
    build();
  });

  document.getElementById("copyBtn").addEventListener("click", (e) => {
    const json = JSON.stringify(P, null, 2);
    const btn = e.currentTarget;
    const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(json).then(done, done);
    else done();
  });

  const panel = document.getElementById("panel");
  document.getElementById("panelToggle").addEventListener("click", () => {
    panel.classList.toggle("collapsed");
    document.getElementById("panelToggle").firstChild &&
      (document.getElementById("panelToggle").textContent =
        panel.classList.contains("collapsed") ? "Parameters +" : "Parameters ×");
  });

  // Debounced resize. On mobile the URL bar growing/shrinking changes only the
  // height by a few dozen px; rebuilding on every such tick causes flicker, so
  // ignore height-only jitter and rebuild only on real layout changes.
  let lastW = 0, lastH = 0, rt = 0;
  function onResize() {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const w = window.innerWidth, h = window.innerHeight;
      const heightOnlyJitter =
        w === lastW && Math.abs(h - lastH) < 120 && COARSE;
      if (heightOnlyJitter) return;
      lastW = w; lastH = h;
      layout();
    }, 150);
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  let started = false;
  function start() {
    if (started) return;
    started = true;
    lastW = window.innerWidth; lastH = window.innerHeight;
    layout();
    frame();
  }
  // Autoplay the (muted) clip; some browsers need an explicit play() call.
  const tryPlay = () => { const p = media.play(); if (p && p.catch) p.catch(() => {}); };
  if (mediaReady()) { tryPlay(); start(); }
  else {
    media.addEventListener("loadeddata", () => { tryPlay(); start(); });
    media.addEventListener("canplay", tryPlay);
  }
  // Resume playback after tab/app switches or if autoplay was blocked until a tap.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tryPlay(); });
  window.addEventListener("touchstart", tryPlay, { once: true, passive: true });
})();
</script>
</body>
</html>
